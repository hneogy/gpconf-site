name: library status (weekly)

on:
  schedule:
    - cron: "23 7 * * 1"   # Mondays 07:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: library
  cancel-in-progress: false

jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the latest python-sgp4 and Skyfield from PyPI
        run: python -m pip install --upgrade pip sgp4 skyfield
      - name: Run the no-network reproducers and the Alpha-5 vectors
        run: python jobs/library_status.py
      - name: Commit the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/library/latest.json data/library/history.json
          git diff --cached --quiet && echo "no change" || git commit -m "library: $(date -u +%Y-%m-%d)"
          git push
