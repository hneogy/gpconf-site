name: tracker (daily)

on:
  schedule:
    - cron: "17 6 * * *"   # once a day, 06:17 UTC; CelesTrak refreshes at most every 2 hours, so once is plenty
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run the tracker (at most 10 requests, each URL once, no retries)
        run: python jobs/tracker.py
      - name: Commit the computed JSON (counts, states, hashes, timestamps only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracker/history.json data/tracker/latest.json data/tracker/drift.json
          git diff --cached --quiet && echo "no change" || git commit -m "tracker: $(date -u +%Y-%m-%d)"
          git push
