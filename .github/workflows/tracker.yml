name: tracker (daily)

on:
  schedule:
    - cron: "17 6 * * *"   # once a day, 06:17 UTC; CelesTrak refreshes at most every 2 hours, so once is plenty
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run the tracker (at most 10 requests, each URL once, no retries)
        run: |
          set -o pipefail
          python jobs/tracker.py | tee tracker-run.log
          { echo '```'; cat tracker-run.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve this run's data and log as an artifact, whatever the validation below decides
        uses: actions/upload-artifact@v4
        with:
          name: tracker-run-${{ github.run_number }}
          path: |
            data/tracker/history.json
            data/tracker/latest.json
            data/tracker/drift.json
            tracker-run.log
          retention-days: 30
      - name: Validate before committing (the bot's push does not trigger CI, so this is the only test run today's data gets before Cloudflare builds it)
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -t . -v
          python build.py
      - name: Commit the computed JSON (counts, states, hashes, timestamps only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracker/history.json data/tracker/latest.json data/tracker/drift.json
          git diff --cached --quiet && echo "no change" || git commit -m "tracker: $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
